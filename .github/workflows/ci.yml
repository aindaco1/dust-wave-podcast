name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            ffmpeg \
            fontconfig \
            fonts-dejavu-core \
            imagemagick
      - name: Generate types, type-check, and test
        run: npm run check
      - name: Validate staging bundle
        run: npm run deploy:staging:dry
      - name: Validate production bundle
        run: npm run deploy:production:dry
