name: Monitor staging podcast launch readiness

on:
  schedule:
    - cron: "43 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-launch-readiness-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: podcast-staging
    steps:
      - name: Check out exact gate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Read the content-free launch gate
        id: gate
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PODCAST_LAUNCH_EPISODE_ID: ${{ vars.PODCAST_LAUNCH_EPISODE_ID }}
          REPORT_DIRECTORY: ${{ runner.temp }}/podcast-launch-readiness
        run: |
          install -d -m 700 "$REPORT_DIRECTORY"
          install /dev/null -m 600 "$REPORT_DIRECTORY/report.json"
          set +e
          npm run gate:launch:staging -- \
            "$PODCAST_LAUNCH_EPISODE_ID" \
            --json > "$REPORT_DIRECTORY/report.json"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Add bounded launch summary
        if: ${{ always() }}
        env:
          LAUNCH_GATE_REPORT: ${{ runner.temp }}/podcast-launch-readiness/report.json
        run: node scripts/write-launch-readiness-summary.mjs

      - name: Retain content-free launch evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: launch-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/podcast-launch-readiness/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce gate execution safety
        if: ${{ always() }}
        env:
          GATE_STATUS: ${{ steps.gate.outputs.status }}
        run: test "$GATE_STATUS" = "0"
