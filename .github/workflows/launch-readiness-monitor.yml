name: Monitor staging podcast launch readiness

on:
  schedule:
    - cron: "43 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-launch-readiness-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: podcast-staging
    steps:
      - name: Check out exact gate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install verified Stripe CLI
        env:
          STRIPE_CLI_VERSION: 1.45.1
          STRIPE_CLI_SHA256: ae0b6e83f6b5edf8e0d61e5965b0ef6fffd94bb685ce063c030dba2ce221e332
        run: |
          install -d -m 700 "$RUNNER_TEMP/stripe-cli"
          cd "$RUNNER_TEMP/stripe-cli"
          archive="stripe_${STRIPE_CLI_VERSION}_linux_x86_64.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --retry 3 \
            "https://github.com/stripe/stripe-cli/releases/download/v${STRIPE_CLI_VERSION}/${archive}" \
            --output "$archive"
          echo "${STRIPE_CLI_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" stripe
          chmod 700 stripe
          echo "$RUNNER_TEMP/stripe-cli" >> "$GITHUB_PATH"

      - name: Read the content-free launch gate
        id: gate
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          PODCAST_LAUNCH_EPISODE_ID: ${{ vars.PODCAST_LAUNCH_EPISODE_ID }}
          REPORT_DIRECTORY: ${{ runner.temp }}/podcast-launch-readiness
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || \
            [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || \
            [ -z "${STRIPE_API_KEY:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "status=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          install -d -m 700 "$REPORT_DIRECTORY"
          install /dev/null -m 600 "$REPORT_DIRECTORY/report.json"
          set +e
          npm run --silent gate:launch:staging -- \
            "$PODCAST_LAUNCH_EPISODE_ID" \
            --json > "$REPORT_DIRECTORY/report.json"
          status=$?
          set -e
          if LAUNCH_GATE_REPORT="$REPORT_DIRECTORY/report.json" \
            node scripts/write-launch-readiness-summary.mjs --validate-only; then
            report_ready=true
          else
            report_ready=false
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "report_ready=$report_ready" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Add bounded launch summary
        if: ${{ always() && steps.gate.outputs.configured == 'true' && steps.gate.outputs.report_ready == 'true' }}
        env:
          LAUNCH_GATE_REPORT: ${{ runner.temp }}/podcast-launch-readiness/report.json
        run: node scripts/write-launch-readiness-summary.mjs

      - name: Report bounded policy failure
        if: ${{ always() && steps.gate.outputs.configured == 'true' && steps.gate.outputs.report_ready == 'true' && steps.gate.outputs.status != '0' }}
        run: |
          echo "### Monitor result" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: FAIL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: the bounded report contains one or more failed safety gates" >> "$GITHUB_STEP_SUMMARY"
          echo "- Classification: policy failure; the scoped live read completed" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failed live read
        if: ${{ always() && steps.gate.outputs.configured == 'true' && steps.gate.outputs.report_ready != 'true' }}
        run: |
          echo "### Podcast launch readiness" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: FAIL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: a scoped live read failed before a bounded report was produced" >> "$GITHUB_STEP_SUMMARY"

      - name: Report missing durable monitor credential
        if: ${{ always() && steps.gate.outputs.configured != 'true' }}
        run: |
          echo "### Podcast launch readiness" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: BLOCK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: scoped staging read credentials are not configured" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain content-free launch evidence
        if: ${{ always() && steps.gate.outputs.configured == 'true' && steps.gate.outputs.report_ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: launch-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/podcast-launch-readiness/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce gate execution safety
        if: ${{ always() }}
        env:
          GATE_CONFIGURED: ${{ steps.gate.outputs.configured }}
          REPORT_READY: ${{ steps.gate.outputs.report_ready }}
          GATE_STATUS: ${{ steps.gate.outputs.status }}
        run: |
          if [ "$GATE_CONFIGURED" != "true" ]; then
            exit 0
          fi
          test "$REPORT_READY" = "true"
          test "$GATE_STATUS" = "0"
