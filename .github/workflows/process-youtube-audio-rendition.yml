name: Process staging YouTube audio rendition

on:
  workflow_dispatch:
    inputs:
      rendition_id:
        description: Queued audio-rendition ID from the isolated staging admin
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-youtube-audio-${{ inputs.rendition_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: podcast-staging
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify media tools
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Render, fully decode, and upload private MP4
        id: rendition
        env:
          RENDITION_ID: ${{ inputs.rendition_id }}
          MEDIA_PROCESSOR_CALLBACK_SECRET: ${{ secrets.MEDIA_PROCESSOR_CALLBACK_SECRET }}
        run: node scripts/process-youtube-audio-rendition.mjs

      - name: Retain bounded non-secret evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: youtube-audio-rendition-report
          path: |
            work/youtube-audio-rendition/manifest.json
            work/youtube-audio-rendition/callback.json
            work/youtube-audio-rendition/failure-callback.json
            work/youtube-audio-rendition/upload-response.json
          if-no-files-found: warn
          retention-days: 30
