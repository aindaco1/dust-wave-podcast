name: Process staging Podcast delivery audio

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Queued delivery-audio job ID from staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-delivery-audio-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: podcast-staging
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify media tools
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Render, validate, and upload private delivery media
        id: delivery
        env:
          DELIVERY_AUDIO_JOB_ID: ${{ inputs.job_id }}
          MEDIA_PROCESSOR_CALLBACK_SECRET: ${{ secrets.MEDIA_PROCESSOR_CALLBACK_SECRET }}
        run: node scripts/process-delivery-audio.mjs

      - name: Retain non-secret delivery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: delivery-audio-report
          path: work/delivery-audio/processor-evidence.json
          if-no-files-found: warn
          retention-days: 30
