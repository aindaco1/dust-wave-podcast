name: Set up Podcast processor Node runtime
description: Install the pinned Node runtime and locked repository dependencies.

inputs:
  install-dependencies:
    description: Run npm ci after configuring Node.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up pinned Node runtime
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 22
        cache: npm

    - name: Install locked dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      run: npm ci
